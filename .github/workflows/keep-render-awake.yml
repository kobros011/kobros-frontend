name: Keep Render frontend awake

on:
  schedule:
    # Cada 10 minutos (UTC)
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping login page
        run: |
          curl --fail --silent --show-error --location \
            --max-time 60 \
            --retry 2 \
            --retry-delay 10 \
            --write-out "\nHTTP %{http_code} in %{time_total}s\n" \
            "https://kobros-frontend.onrender.com/srv1/login"
